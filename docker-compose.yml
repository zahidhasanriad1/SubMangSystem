services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignflow}
      POSTGRES_USER: ${POSTGRES_USER:-assignflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - assignflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignflow};Username=${POSTGRES_USER:-assignflow};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__Issuer: AssignFlow.API
      Jwt__Audience: AssignFlow.Angular
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Database__ApplyMigrationsOnStartup: "true"
      Seed__Enabled: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-mzhr.riad@gmail.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__DemoPassword: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: AssignFlow.UI/Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  assignflow_postgres:
